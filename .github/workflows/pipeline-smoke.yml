name: Pipeline Integration Smoke Test

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/offscreen/**"
      - "src/shared/**"
      - "src/test/**"
      - ".github/workflows/pipeline-smoke.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/offscreen/**"
      - "src/shared/**"
      - "src/test/**"
      - ".github/workflows/pipeline-smoke.yml"
  workflow_dispatch:

jobs:
  pipeline-smoke:
    name: CPU Pipeline Smoke Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension (Vite + TypeScript)
        run: npm run build

      - name: Cache Neural Model Weights
        uses: actions/cache@v4
        with:
          path: src/test/models
          key: kites-smoke-models-v1

      - name: Run Pipeline Smoke Matrix
        run: npm run test:pipeline:smoke

      - name: Upload Baked Smoke Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke-results
          path: src/test/result/pipeline_smoke/
          retention-days: 7
